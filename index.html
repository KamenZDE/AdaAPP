<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adélka</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  /* ---------- barvy a pisma na jednom miste ---------- */
  :root {
    --cerna:         #05070c;
    --cerna-mekka:   #0c1018;
    --modra-jemna:   #7c9cc4;

    --zelena-tma:    #041a12;
    --zelena-stred:  #0a2e20;
    --zelena:        #34d399;
    --zelena-svetla: #6ee7b7;
    --text-zeleny:   #d7fbe9;

    --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    --sans:  system-ui, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
  }

  body {
    font-family: var(--sans);
    overflow: hidden;
  }

  /* obe obrazovky se chovaji stejne: pres cely displej, obsah uprostred */
  .obrazovka {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }


  /* ================= 1. OBRAZOVKA: ZAMEK ================= */

  #zamek {
    background: radial-gradient(ellipse at 50% 35%, #131c2e 0%, var(--cerna-mekka) 45%, var(--cerna) 100%);
    color: #e8eef7;
  }

  /* hvezdicky v pozadi - vyrabi je JavaScript */
  #hvezdy {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }

  #hvezdy span {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    animation: blikani 4s ease-in-out infinite;
  }

  @keyframes blikani {
    0%, 100% { opacity: .15; }
    50%      { opacity: .9; }
  }

  .zamek-obsah {
    position: relative;   /* aby byl obsah nad hvezdami */
    z-index: 1;
    max-width: 380px;
    width: 100%;
  }

  .ikona-zamku {
    width: 34px;
    height: 34px;
    color: var(--modra-jemna);
    opacity: .75;
    margin-bottom: 22px;
  }

  #zamek h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(30px, 8vw, 42px);
    margin: 0 0 10px;
  }

  .podtitulek {
    font-size: 13px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: #8695ad;
    margin: 0 0 32px;
  }

  #form-hesla {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  #heslo {
    font-family: var(--sans);
    font-size: 17px;
    text-align: center;
    letter-spacing: .3em;
    padding: 14px 16px;
    color: #e8eef7;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 10px;
    outline: none;
    transition: border-color .25s, background .25s;
  }

  #heslo:focus {
    border-color: var(--modra-jemna);
    background: rgba(255,255,255,.07);
  }

  #heslo::placeholder {
    letter-spacing: .1em;
    color: #55627a;
  }

  .tlacitko-zamku {
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .08em;
    padding: 14px;
    color: #0b1020;
    background: #cdd8e8;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background .25s, transform .12s;
  }

  .tlacitko-zamku:hover  { background: #fff; }
  .tlacitko-zamku:active { transform: scale(.97); }

  #chyba {
    min-height: 22px;       /* misto rezervovane dopredu, stranka nepodskakuje */
    margin: 14px 0 0;
    font-size: 14px;
    color: #e8879b;
    opacity: 0;
    transition: opacity .3s;
  }

  #chyba.vidno { opacity: 1; }

  /* zatreseni polickem pri spatnem hesle */
  .zatrepat { animation: zatreseni .45s; }

  @keyframes zatreseni {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-9px); }
    40%, 80% { transform: translateX(9px); }
  }


  /* ================= 2. OBRAZOVKA: ADA ================= */

  #hlavni {
    display: none;          /* JavaScript ji odkryje az po spravnem hesle */
    background: radial-gradient(ellipse at 50% 32%, var(--zelena-stred) 0%, #062318 48%, var(--zelena-tma) 100%);
    color: var(--text-zeleny);
  }

  #hlavni.vidno {
    display: flex;
    animation: prolnuti .9s ease both;
  }

  @keyframes prolnuti {
    from { opacity: 0; transform: scale(.985); }
    to   { opacity: 1; transform: scale(1); }
  }

  /* jemna zelena zare za jmenem */
  .zare {
    position: absolute;
    width: min(560px, 90vw);
    height: min(560px, 90vw);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -62%);
    background: radial-gradient(circle, rgba(52,211,153,.16) 0%, transparent 68%);
    pointer-events: none;
  }

  /* ---- padajici srdicka v pozadi ---- */

  .padajici {
    position: absolute;
    inset: 0;
    overflow: hidden;      /* srdicka nesmi delat posuvniky */
    pointer-events: none;  /* aby neprekazela klikani */
    z-index: 0;            /* nad zari, pod textem */
  }

  .padajici svg {
    position: absolute;
    top: -10vh;            /* start kousek nad hornim okrajem */
    color: var(--zelena-svetla);
    animation-name: padani;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }

  /* Promenne --vrchol, --posun a --otoceni nastavuje kazdemu srdicku
     JavaScript zvlast, takze zadna dve nepadaji uplne stejne. */
  @keyframes padani {
    0%   { transform: translate(0, 0) rotate(0deg);                              opacity: 0; }
    12%  {                                                                        opacity: var(--vrchol); }
    88%  {                                                                        opacity: var(--vrchol); }
    100% { transform: translate(var(--posun), 118vh) rotate(var(--otoceni));     opacity: 0; }
  }

  /* ---- srdicko vyletajici z tlacitka ---- */

  .vyletajici {
    position: absolute;
    color: var(--zelena-svetla);
    pointer-events: none;
    z-index: 2;                    /* nad textem, at je videt */
    animation: vylet 1.5s ease-out forwards;
  }

  @keyframes vylet {
    0%   { transform: translate(-50%, -50%) scale(.3) rotate(0deg);  opacity: 0; }
    18%  { transform: translate(-50%, -50%) scale(1)  rotate(0deg);  opacity: .95; }
    100% { transform: translate(calc(-50% + var(--unik)), calc(-50% - 165px))
                     scale(.7) rotate(var(--otoc));                  opacity: 0; }
  }

  /* ---- pozdrav podle denni doby ---- */

  .pozdrav {
    position: relative;
    z-index: 1;
    font-size: 13px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: rgba(167, 243, 208, .6);
    margin: 0 0 20px;
    animation: naskoceni .9s ease both;
    animation-delay: .35s;         /* prijde chvilku po jmenu */
  }

  /* Kdo ma v systemu vypnute animace, dostane klidnou stranku. */
  @media (prefers-reduced-motion: reduce) {
    .srdce,
    .padajici svg,
    #hvezdy span { animation: none; }
  }

  .radek-jmena {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(16px, 5vw, 34px);
  }

  .jmeno {
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(64px, 20vw, 130px);
    line-height: 1;
    margin: 0;
    color: #fff;
    text-shadow: 0 0 40px rgba(52,211,153,.35);
  }

  .srdce {
    width: clamp(26px, 7vw, 44px);
    height: auto;
    color: var(--zelena);
    animation: tep 2.6s ease-in-out infinite;
  }

  /* prave srdicko tepe se zpozdenim, pusobi to zivěji */
  .srdce.vpravo { animation-delay: 1.3s; }

  @keyframes tep {
    0%, 100% { transform: scale(1);    opacity: .72; }
    50%      { transform: scale(1.14); opacity: 1; }
  }

  .carka {
    width: 64px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(110,231,183,.55), transparent);
    margin: 30px 0 26px;
    position: relative;
    z-index: 1;
  }

  #tlacitko {
    position: relative;
    z-index: 1;
    font-family: var(--sans);
    font-size: 16px;
    font-weight: 600;
    letter-spacing: .06em;
    padding: 15px 38px;
    color: #04231a;
    background: linear-gradient(180deg, var(--zelena-svetla), var(--zelena));
    border: none;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 6px 26px rgba(52,211,153,.28);
    transition: transform .14s, box-shadow .25s;
  }

  #tlacitko:hover  { transform: translateY(-2px); box-shadow: 0 10px 34px rgba(52,211,153,.42); }
  #tlacitko:active { transform: translateY(0) scale(.97); }

  #hlaska {
    position: relative;
    z-index: 1;
    font-family: var(--serif);
    font-size: clamp(26px, 7vw, 40px);
    font-weight: 600;
    margin: 34px 0 0;
    min-height: 1.4em;      /* misto rezervovane dopredu */
    color: #fff;
  }

  #hlaska.naskoc { animation: naskoceni .65s ease both; }

  @keyframes naskoceni {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }


  /* ================= NAROZENINOVY REZIM ================= */
  /* Zije jen 16.-18. rijna. Zapina a vypina se sam podle data,
     rozhoduje o tom funkce jeNarozeninovyRezim() dole v JavaScriptu. */

  /* Staci prepsat tri promenne a vsechno zelene zezlatne samo -
     vcetne padajicich i vyletajicich srdicek. */
  #hlavni.narozeniny {
    --zelena:        #f5b73e;
    --zelena-svetla: #fcd97a;
    --text-zeleny:   #fdf3dd;
    background: radial-gradient(ellipse at 50% 30%, #4a3310 0%, #2e2008 48%, #180f03 100%);
  }

  /* Tohle jsou mista, kde je zelena napsana napevno, ne pres promennou */
  #hlavni.narozeniny .zare {
    background: radial-gradient(circle, rgba(245,183,62,.2) 0%, transparent 68%);
  }

  #hlavni.narozeniny .jmeno      { text-shadow: 0 0 40px rgba(245,183,62,.45); }
  #hlavni.narozeniny .pozdrav    { color: rgba(253,243,221,.7); }
  #hlavni.narozeniny .carka      { background: linear-gradient(90deg, transparent, rgba(252,217,122,.6), transparent); }

  #hlavni.narozeniny #tlacitko {
    color: #2e2008;
    box-shadow: 0 6px 26px rgba(245,183,62,.3);
  }

  #hlavni.narozeniny #tlacitko:hover {
    box-shadow: 0 10px 34px rgba(245,183,62,.45);
  }

  /* ---- velka dvacitka ---- */

  .dvacitka {
    display: none;                  /* mimo narozeniny vubec neexistuje */
    position: relative;
    z-index: 1;
    font-family: var(--serif);
    font-weight: 700;
    font-size: clamp(88px, 26vw, 180px);
    line-height: .88;
    margin: 0 0 2px;
    color: #fcd97a;
    text-shadow: 0 0 55px rgba(245,183,62,.55);
    animation: naskoceni 1s ease both;
  }

  #hlavni.narozeniny .dvacitka { display: block; }

  /* ---- tlacitko s darkem ---- */

  .darek {
    display: none;                  /* mimo narozeniny taky schovane */
    position: relative;
    z-index: 1;
    align-items: center;
    gap: 9px;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: .06em;
    margin-top: 30px;
    padding: 12px 24px;
    color: #fcd97a;
    background: transparent;
    border: 1px solid rgba(252,217,122,.45);
    border-radius: 999px;
    cursor: pointer;
    transition: background .25s, border-color .25s, transform .14s;
  }

  #hlavni.narozeniny .darek { display: inline-flex; }

  .darek:hover  { background: rgba(252,217,122,.1); border-color: rgba(252,217,122,.8); }
  .darek:active { transform: scale(.97); }

  .darek svg { width: 18px; height: 18px; }

  /* ---- vzkaz po rozbaleni ---- */

  .obal-darku {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(12, 8, 2, .88);
    backdrop-filter: blur(6px);
  }

  .obal-darku.vidno {
    display: flex;
    animation: prolnuti .5s ease both;
  }

  .karta {
    position: relative;
    width: 100%;
    max-width: 430px;
    max-height: 80vh;
    overflow-y: auto;              /* delsi vzkaz jde odrolovat */
    padding: 40px 32px 34px;
    text-align: left;
    background: linear-gradient(170deg, #35250b 0%, #231806 100%);
    border: 1px solid rgba(252,217,122,.3);
    border-radius: 16px;
    box-shadow: 0 24px 70px rgba(0,0,0,.6);
    animation: karta-naskoc .6s cubic-bezier(.2,.9,.3,1.1) both;
  }

  @keyframes karta-naskoc {
    from { opacity: 0; transform: translateY(26px) scale(.95); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .zavrit {
    position: absolute;
    top: 12px;
    right: 14px;
    width: 32px;
    height: 32px;
    font-size: 22px;
    line-height: 1;
    color: rgba(253,243,221,.5);
    background: none;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    transition: color .2s, background .2s;
  }

  .zavrit:hover { color: #fdf3dd; background: rgba(252,217,122,.12); }

  .vzkaz {
    font-family: var(--serif);
    font-size: clamp(19px, 4.6vw, 23px);
    font-weight: 400;
    line-height: 1.6;
    margin: 0;
    color: #fdf3dd;
    white-space: pre-line;         /* prazdne radky ve vzkazu zustanou */
  }

  .podpis {
    margin: 26px 0 0;
    font-family: var(--serif);
    font-size: 17px;
    text-align: right;
    color: rgba(252,217,122,.8);
  }
</style>
</head>

<body>

<!-- ============ 1. OBRAZOVKA: ZAMEK ============ -->
<section class="obrazovka" id="zamek">
  <div id="hvezdy"></div>

  <div class="zamek-obsah">
    <svg class="ikona-zamku" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3.5" y="10.5" width="17" height="11" rx="2.5"/>
      <path d="M7.5 10.5V7a4.5 4.5 0 0 1 9 0v3.5"/>
    </svg>

    <h1>Jen pro jednu osobu</h1>
    <p class="podtitulek">zadej heslo</p>

    <form id="form-hesla">
      <input id="heslo" type="password" placeholder=". . . . . . . . ."
             autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="tlacitko-zamku" type="submit">Vstoupit</button>
    </form>

    <p id="chyba"></p>
  </div>
</section>


<!-- ============ 2. OBRAZOVKA: ADA ============ -->
<main class="obrazovka" id="hlavni">
  <div class="zare"></div>
  <div class="padajici" id="padajici" aria-hidden="true"></div>

  <p class="pozdrav" id="pozdrav"></p>

  <p class="dvacitka">20</p>

  <div class="radek-jmena">
    <svg class="srdce vlevo" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
    </svg>

    <h1 class="jmeno">Adélka</h1>

    <svg class="srdce vpravo" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
    </svg>
  </div>

  <div class="carka"></div>

  <button id="tlacitko">Klikni sem</button>
  <p id="hlaska"></p>

  <button class="darek" id="darek">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="9.5" width="18" height="11.5" rx="1.6"/>
      <path d="M2 9.5h20M12 9.5V21"/>
      <path d="M12 9.5S10.6 3.5 8.2 3.5a2.1 2.1 0 0 0 0 6M12 9.5s1.4-6 3.8-6a2.1 2.1 0 0 1 0 6"/>
    </svg>
    Rozbal dárek
  </button>
</main>

<!-- vzkaz, ktery se objevi po rozbaleni darku -->
<div class="obal-darku" id="obal-darku">
  <div class="karta" role="dialog" aria-modal="true" aria-label="Vzkaz">
    <button class="zavrit" id="zavrit-darku" aria-label="Zavřít">&times;</button>
    <p class="vzkaz" id="vzkaz-darku">Dnešní ráno nedopadlo úplně dobře a za to jsem se už omluvil. Doufám, že večer bude lepší a že se ti bude líbit dárek, který ode mě máš. Mám tě nejradši, záleží mi na tobě a vážím si tě ❤️</p>
  </div>
</div>


<script>
/* ---------------- 1. hvezdicky na uvodni obrazovce ---------------- */

const hvezdy = document.getElementById("hvezdy");

for (let i = 0; i < 70; i++) {
  const h = document.createElement("span");
  const velikost = (1 + Math.random() * 1.6).toFixed(1);

  h.style.width  = velikost + "px";
  h.style.height = velikost + "px";
  h.style.left   = (Math.random() * 100).toFixed(2) + "%";
  h.style.top    = (Math.random() * 100).toFixed(2) + "%";
  h.style.animationDelay = (Math.random() * 4).toFixed(2) + "s";

  hvezdy.appendChild(h);
}


/* ------- padajici srdicka na zelene obrazovce ------- */

// Stejny tvar srdce jako ta dve velka vedle jmena.
const CESTA_SRDCE = "M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z";

// Vyrobi jedno prazdne SVG srdicko. SVG se musi delat pres createElementNS,
// jinak ho prohlizec nevykresli. Pouzivaji to padajici i vyletajici srdicka.
function noveSrdce() {
  const NS = "http://www.w3.org/2000/svg";

  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("fill", "currentColor");

  const cesta = document.createElementNS(NS, "path");
  cesta.setAttribute("d", CESTA_SRDCE);
  svg.appendChild(cesta);

  return svg;
}

// Ma uzivatel v systemu vypnute animace?
const klidnyRezim = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function vyrobPadajiciSrdicka(pocet) {
  const vrstva = document.getElementById("padajici");

  for (let i = 0; i < pocet; i++) {
    const svg = noveSrdce();
    const velikost = (9 + Math.random() * 17).toFixed(1);

    svg.style.width  = velikost + "px";
    svg.style.height = velikost + "px";
    svg.style.left   = (Math.random() * 100).toFixed(2) + "%";

    // kazde srdicko pada jinak dlouho
    svg.style.animationDuration = (12 + Math.random() * 12).toFixed(1) + "s";

    // zaporne zpozdeni = animace uz bezi od prostredka,
    // takze po odemceni nekouka uzivatel na prazdnou obrazovku
    svg.style.animationDelay = (-Math.random() * 24).toFixed(1) + "s";

    svg.style.setProperty("--vrchol",  (0.10 + Math.random() * 0.18).toFixed(2));
    svg.style.setProperty("--posun",   (Math.random() * 90 - 45).toFixed(0) + "px");
    svg.style.setProperty("--otoceni", (Math.random() * 100 - 50).toFixed(0) + "deg");

    vrstva.appendChild(svg);
  }
}


/* ------- srdicko vyletajici z tlacitka ------- */

function vypustSrdicko() {
  if (klidnyRezim) return;

  const tlac = document.getElementById("tlacitko");
  const misto = tlac.getBoundingClientRect();
  const svg = noveSrdce();

  svg.classList.add("vyletajici");

  const velikost = (16 + Math.random() * 8).toFixed(1);
  svg.style.width  = velikost + "px";
  svg.style.height = velikost + "px";

  // #hlavni je fixed pres celou obrazovku, takze souradnice okna
  // se rovnaji souradnicim uvnitr nej
  svg.style.left = (misto.left + misto.width / 2) + "px";
  svg.style.top  = (misto.top + misto.height / 2) + "px";

  svg.style.setProperty("--unik", (Math.random() * 70 - 35).toFixed(0) + "px");
  svg.style.setProperty("--otoc", (Math.random() * 80 - 40).toFixed(0) + "deg");

  // po dolétnutí srdicko zmizi z HTML, at se stranka nezanasi
  svg.addEventListener("animationend", function () {
    svg.remove();
  });

  document.getElementById("hlavni").appendChild(svg);
}


/* ------- pozdrav podle denni doby ------- */

function pozdravPodleHodiny() {
  const hodina = new Date().getHours();

  if (hodina >= 5  && hodina < 11) return "Dobré ráno";
  if (hodina >= 11 && hodina < 18) return "Hezký den";
  if (hodina >= 18 && hodina < 22) return "Dobrý večer";
  return "Dobrou noc";
}


/* ------- narozeninovy rezim ------- */

// Bezi 16.-18. rijna. Rok se nekontroluje schvalne -
// diky tomu to nabehne samo kazdy rok znovu.
const NAROZENINY_MESIC = 10;
const NAROZENINY_OD    = 16;
const NAROZENINY_DO    = 18;

function jeNarozeninovyRezim() {
  const dnes = new Date();
  const mesic = dnes.getMonth() + 1;   // getMonth() vraci 0-11, proto +1
  const den = dnes.getDate();

  return mesic === NAROZENINY_MESIC && den >= NAROZENINY_OD && den <= NAROZENINY_DO;
}


/* ---------------- 2. zamek ---------------- */

const HESLO = "narozeniny";

const zamek  = document.getElementById("zamek");
const hlavni = document.getElementById("hlavni");
const form   = document.getElementById("form-hesla");
const vstup  = document.getElementById("heslo");
const chyba  = document.getElementById("chyba");

vstup.focus();

function zkusHeslo() {
  if (vstup.value.trim().toLowerCase() === HESLO) {
    odemkni();
  } else {
    chyba.textContent = "To není ono. Zkus to ještě jednou.";
    chyba.classList.add("vidno");

    // trik: tridu je nutne nejdriv sundat, aby sla animace pustit znovu
    vstup.classList.remove("zatrepat");
    void vstup.offsetWidth;
    vstup.classList.add("zatrepat");

    vstup.select();
  }
}

// kliknuti na tlacitko Vstoupit
form.addEventListener("submit", function (udalost) {
  udalost.preventDefault();   // aby se stranka po odeslani neprenacetla
  zkusHeslo();
});

// Enter v policku. Nespolehame se na to, ze ho formular odchyti sam -
// na nekterych klavesnicich (hlavne mobilnich) se to nemusi stat.
vstup.addEventListener("keydown", function (udalost) {
  if (udalost.key === "Enter") {
    udalost.preventDefault();
    zkusHeslo();
  }
});

function odemkni() {
  zamek.style.transition = "opacity .7s ease";
  zamek.style.opacity = "0";

  setTimeout(function () {
    zamek.style.display = "none";
    hlavni.classList.add("vidno");
    vyrobPadajiciSrdicka(26);   // az tady, drive by padala do skryte stranky

    if (jeNarozeninovyRezim()) {
      hlavni.classList.add("narozeniny");
      document.getElementById("pozdrav").textContent = "Všechno nejlepší";
    } else {
      document.getElementById("pozdrav").textContent = pozdravPodleHodiny();
    }
  }, 700);
}

  "Nikam neodcházím",
  "Jsi moje oblíbená osoba",
  "Usměj se",
  "Jsem rád, že tě mám",
  "Sluší ti to",
  "Buď na sebe hodná",
  "Zasloužíš si to",
  "Tvůj smích je nejlepší",
  "Pořád mě bavíš",
  "Mám z tebe radost",
  "Odpočiň si",
  "Vidím, jak se snažíš"
];

const tlacitko = document.getElementById("tlacitko");
const hlaska   = document.getElementById("hlaska");

let posledni = -1;   // aby stejna hlaska nepadla dvakrat po sobe

tlacitko.addEventListener("click", function () {
  let index;
  do {
    index = Math.floor(Math.random() * hlasky.length);
  } while (index === posledni);

  posledni = index;
  hlaska.textContent = hlasky[index];

  vypustSrdicko();

  // stejny trik jako u zatreseni - restart animace
  hlaska.classList.remove("naskoc");
  void hlaska.offsetWidth;
  hlaska.classList.add("naskoc");
});


/* ---------------- 4. darek ---------------- */

const darek     = document.getElementById("darek");
const obalDarku = document.getElementById("obal-darku");

function otevriDarek() { obalDarku.classList.add("vidno"); }
function zavriDarek()  { obalDarku.classList.remove("vidno"); }

darek.addEventListener("click", otevriDarek);
document.getElementById("zavrit-darku").addEventListener("click", zavriDarek);

// klik na ztmavene pozadi (ne na kartu) taky zavira
obalDarku.addEventListener("click", function (udalost) {
  if (udalost.target === obalDarku) zavriDarek();
});

// a klavesa Escape
document.addEventListener("keydown", function (udalost) {
  if (udalost.key === "Escape") zavriDarek();
});
