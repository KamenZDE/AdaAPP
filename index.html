<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aďa</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  /* ---------- barvy a pisma na jednom miste ---------- */
  :root {
    --cerna:         #05070c;
    --cerna-mekka:   #0c1018;
    --modra-jemna:   #7c9cc4;

    --zelena-tma:    #041a12;
    --zelena-stred:  #0a2e20;
    --zelena:        #34d399;
    --zelena-svetla: #6ee7b7;
    --text-zeleny:   #d7fbe9;

    --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    --sans:  system-ui, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
  }

  body {
    font-family: var(--sans);
    overflow: hidden;
  }

  /* obe obrazovky se chovaji stejne: pres cely displej, obsah uprostred */
  .obrazovka {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }


  /* ================= 1. OBRAZOVKA: ZAMEK ================= */

  #zamek {
    background: radial-gradient(ellipse at 50% 35%, #131c2e 0%, var(--cerna-mekka) 45%, var(--cerna) 100%);
    color: #e8eef7;
  }

  /* hvezdicky v pozadi - vyrabi je JavaScript */
  #hvezdy {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }

  #hvezdy span {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    animation: blikani 4s ease-in-out infinite;
  }

  @keyframes blikani {
    0%, 100% { opacity: .15; }
    50%      { opacity: .9; }
  }

  .zamek-obsah {
    position: relative;   /* aby byl obsah nad hvezdami */
    z-index: 1;
    max-width: 380px;
    width: 100%;
  }

  .ikona-zamku {
    width: 34px;
    height: 34px;
    color: var(--modra-jemna);
    opacity: .75;
    margin-bottom: 22px;
  }

  #zamek h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(30px, 8vw, 42px);
    margin: 0 0 10px;
  }

  .podtitulek {
    font-size: 13px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: #8695ad;
    margin: 0 0 32px;
  }

  #form-hesla {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  #heslo {
    font-family: var(--sans);
    font-size: 17px;
    text-align: center;
    letter-spacing: .3em;
    padding: 14px 16px;
    color: #e8eef7;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 10px;
    outline: none;
    transition: border-color .25s, background .25s;
  }

  #heslo:focus {
    border-color: var(--modra-jemna);
    background: rgba(255,255,255,.07);
  }

  #heslo::placeholder {
    letter-spacing: .1em;
    color: #55627a;
  }

  .tlacitko-zamku {
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .08em;
    padding: 14px;
    color: #0b1020;
    background: #cdd8e8;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background .25s, transform .12s;
  }

  .tlacitko-zamku:hover  { background: #fff; }
  .tlacitko-zamku:active { transform: scale(.97); }

  #chyba {
    min-height: 22px;       /* misto rezervovane dopredu, stranka nepodskakuje */
    margin: 14px 0 0;
    font-size: 14px;
    color: #e8879b;
    opacity: 0;
    transition: opacity .3s;
  }

  #chyba.vidno { opacity: 1; }

  /* zatreseni polickem pri spatnem hesle */
  .zatrepat { animation: zatreseni .45s; }

  @keyframes zatreseni {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-9px); }
    40%, 80% { transform: translateX(9px); }
  }


  /* ================= 2. OBRAZOVKA: ADA ================= */

  #hlavni {
    display: none;          /* JavaScript ji odkryje az po spravnem hesle */
    background: radial-gradient(ellipse at 50% 32%, var(--zelena-stred) 0%, #062318 48%, var(--zelena-tma) 100%);
    color: var(--text-zeleny);
  }

  #hlavni.vidno {
    display: flex;
    animation: prolnuti .9s ease both;
  }

  @keyframes prolnuti {
    from { opacity: 0; transform: scale(.985); }
    to   { opacity: 1; transform: scale(1); }
  }

  /* jemna zelena zare za jmenem */
  .zare {
    position: absolute;
    width: min(560px, 90vw);
    height: min(560px, 90vw);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -62%);
    background: radial-gradient(circle, rgba(52,211,153,.16) 0%, transparent 68%);
    pointer-events: none;
  }

  /* ---- padajici srdicka v pozadi ---- */

  .padajici {
    position: absolute;
    inset: 0;
    overflow: hidden;      /* srdicka nesmi delat posuvniky */
    pointer-events: none;  /* aby neprekazela klikani */
    z-index: 0;            /* nad zari, pod textem */
  }

  .padajici svg {
    position: absolute;
    top: -10vh;            /* start kousek nad hornim okrajem */
    color: var(--zelena-svetla);
    animation-name: padani;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }

  /* Promenne --vrchol, --posun a --otoceni nastavuje kazdemu srdicku
     JavaScript zvlast, takze zadna dve nepadaji uplne stejne. */
  @keyframes padani {
    0%   { transform: translate(0, 0) rotate(0deg);                              opacity: 0; }
    12%  {                                                                        opacity: var(--vrchol); }
    88%  {                                                                        opacity: var(--vrchol); }
    100% { transform: translate(var(--posun), 118vh) rotate(var(--otoceni));     opacity: 0; }
  }

  /* Kdo ma v systemu vypnute animace, dostane klidnou stranku. */
  @media (prefers-reduced-motion: reduce) {
    .srdce,
    .padajici svg,
    #hvezdy span { animation: none; }
  }

  .radek-jmena {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(16px, 5vw, 34px);
  }

  .jmeno {
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(64px, 20vw, 130px);
    line-height: 1;
    margin: 0;
    color: #fff;
    text-shadow: 0 0 40px rgba(52,211,153,.35);
  }

  .srdce {
    width: clamp(26px, 7vw, 44px);
    height: auto;
    color: var(--zelena);
    animation: tep 2.6s ease-in-out infinite;
  }

  /* prave srdicko tepe se zpozdenim, pusobi to zivěji */
  .srdce.vpravo { animation-delay: 1.3s; }

  @keyframes tep {
    0%, 100% { transform: scale(1);    opacity: .72; }
    50%      { transform: scale(1.14); opacity: 1; }
  }

  .carka {
    width: 64px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(110,231,183,.55), transparent);
    margin: 30px 0 26px;
    position: relative;
    z-index: 1;
  }

  #tlacitko {
    position: relative;
    z-index: 1;
    font-family: var(--sans);
    font-size: 16px;
    font-weight: 600;
    letter-spacing: .06em;
    padding: 15px 38px;
    color: #04231a;
    background: linear-gradient(180deg, var(--zelena-svetla), var(--zelena));
    border: none;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 6px 26px rgba(52,211,153,.28);
    transition: transform .14s, box-shadow .25s;
  }

  #tlacitko:hover  { transform: translateY(-2px); box-shadow: 0 10px 34px rgba(52,211,153,.42); }
  #tlacitko:active { transform: translateY(0) scale(.97); }

  #hlaska {
    position: relative;
    z-index: 1;
    font-family: var(--serif);
    font-size: clamp(26px, 7vw, 40px);
    font-weight: 600;
    margin: 34px 0 0;
    min-height: 1.4em;      /* misto rezervovane dopredu */
    color: #fff;
  }

  #hlaska.naskoc { animation: naskoceni .65s ease both; }

  @keyframes naskoceni {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>

<body>

<!-- ============ 1. OBRAZOVKA: ZAMEK ============ -->
<section class="obrazovka" id="zamek">
  <div id="hvezdy"></div>

  <div class="zamek-obsah">
    <svg class="ikona-zamku" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3.5" y="10.5" width="17" height="11" rx="2.5"/>
      <path d="M7.5 10.5V7a4.5 4.5 0 0 1 9 0v3.5"/>
    </svg>

    <h1>Jen pro jednu osobu</h1>
    <p class="podtitulek">zadej heslo</p>

    <form id="form-hesla">
      <input id="heslo" type="password" placeholder=". . . . . . . . ."
             autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="tlacitko-zamku" type="submit">Vstoupit</button>
    </form>

    <p id="chyba"></p>
  </div>
</section>


<!-- ============ 2. OBRAZOVKA: ADA ============ -->
<main class="obrazovka" id="hlavni">
  <div class="zare"></div>
  <div class="padajici" id="padajici" aria-hidden="true"></div>

  <div class="radek-jmena">
    <svg class="srdce vlevo" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
    </svg>

    <h1 class="jmeno">Aďa</h1>

    <svg class="srdce vpravo" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
    </svg>
  </div>

  <div class="carka"></div>

  <button id="tlacitko">Klikni sem</button>
  <p id="hlaska"></p>
</main>


<script>
/* ---------------- 1. hvezdicky na uvodni obrazovce ---------------- */

const hvezdy = document.getElementById("hvezdy");

for (let i = 0; i < 70; i++) {
  const h = document.createElement("span");
  const velikost = (1 + Math.random() * 1.6).toFixed(1);

  h.style.width  = velikost + "px";
  h.style.height = velikost + "px";
  h.style.left   = (Math.random() * 100).toFixed(2) + "%";
  h.style.top    = (Math.random() * 100).toFixed(2) + "%";
  h.style.animationDelay = (Math.random() * 4).toFixed(2) + "s";

  hvezdy.appendChild(h);
}


/* ------- padajici srdicka na zelene obrazovce ------- */

// Stejny tvar srdce jako ta dve velka vedle jmena.
const CESTA_SRDCE = "M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z";

function vyrobPadajiciSrdicka(pocet) {
  const vrstva = document.getElementById("padajici");
  const NS = "http://www.w3.org/2000/svg";

  for (let i = 0; i < pocet; i++) {
    // SVG se musi vyrabet pres createElementNS, jinak ho prohlizec nevykresli
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", "0 0 24 24");
    svg.setAttribute("fill", "currentColor");

    const cesta = document.createElementNS(NS, "path");
    cesta.setAttribute("d", CESTA_SRDCE);
    svg.appendChild(cesta);

    const velikost = (9 + Math.random() * 17).toFixed(1);

    svg.style.width  = velikost + "px";
    svg.style.height = velikost + "px";
    svg.style.left   = (Math.random() * 100).toFixed(2) + "%";

    // kazde srdicko pada jinak dlouho
    svg.style.animationDuration = (12 + Math.random() * 12).toFixed(1) + "s";

    // zaporne zpozdeni = animace uz bezi od prostredka,
    // takze po odemceni nekouka uzivatel na prazdnou obrazovku
    svg.style.animationDelay = (-Math.random() * 24).toFixed(1) + "s";

    svg.style.setProperty("--vrchol",  (0.10 + Math.random() * 0.18).toFixed(2));
    svg.style.setProperty("--posun",   (Math.random() * 90 - 45).toFixed(0) + "px");
    svg.style.setProperty("--otoceni", (Math.random() * 100 - 50).toFixed(0) + "deg");

    vrstva.appendChild(svg);
  }
}


/* ---------------- 2. zamek ---------------- */

const HESLO = "doctorwho";

const zamek  = document.getElementById("zamek");
const hlavni = document.getElementById("hlavni");
const form   = document.getElementById("form-hesla");
const vstup  = document.getElementById("heslo");
const chyba  = document.getElementById("chyba");

vstup.focus();

function zkusHeslo() {
  if (vstup.value.trim().toLowerCase() === HESLO) {
    odemkni();
  } else {
    chyba.textContent = "To není ono. Zkus to ještě jednou.";
    chyba.classList.add("vidno");

    // trik: tridu je nutne nejdriv sundat, aby sla animace pustit znovu
    vstup.classList.remove("zatrepat");
    void vstup.offsetWidth;
    vstup.classList.add("zatrepat");

    vstup.select();
  }
}

// kliknuti na tlacitko Vstoupit
form.addEventListener("submit", function (udalost) {
  udalost.preventDefault();   // aby se stranka po odeslani neprenacetla
  zkusHeslo();
});

// Enter v policku. Nespolehame se na to, ze ho formular odchyti sam -
// na nekterych klavesnicich (hlavne mobilnich) se to nemusi stat.
vstup.addEventListener("keydown", function (udalost) {
  if (udalost.key === "Enter") {
    udalost.preventDefault();
    zkusHeslo();
  }
});

function odemkni() {
  zamek.style.transition = "opacity .7s ease";
  zamek.style.opacity = "0";

  setTimeout(function () {
    zamek.style.display = "none";
    hlavni.classList.add("vidno");
    vyrobPadajiciSrdicka(26);   // az tady, drive by padala do skryte stranky
  }, 700);
}


/* ---------------- 3. hlasky ---------------- */

const hlasky = [
  "Mám tě moc rád",
  "Mám tě nejradši",
  "Chybíš mi",
  "Záleží mi na tobě",
  "Věřím v tebe",
  "Myslím na tebe",
  "S tebou je mi dobře",
  "Jsem na tebe hrdý",
  "Jsi úžasná",
  "Těším se na tebe",
  "Zvládneš to",
  "Nejsi v tom sama",
  "Držím ti palce",
  "Nikam neodcházím",
  "Jsi moje oblíbená osoba",
  "Usměj se",
  "Jsem rád, že tě mám",
  "Sluší ti to",
  "Buď na sebe hodná",
  "Zasloužíš si to",
  "Tvůj smích je nejlepší",
  "Pořád mě bavíš"
];

const tlacitko = document.getElementById("tlacitko");
const hlaska   = document.getElementById("hlaska");

let posledni = -1;   // aby stejna hlaska nepadla dvakrat po sobe

tlacitko.addEventListener("click", function () {
  let index;
  do {
    index = Math.floor(Math.random() * hlasky.length);
  } while (index === posledni);

  posledni = index;
  hlaska.textContent = hlasky[index];

  // stejny trik jako u zatreseni - restart animace
  hlaska.classList.remove("naskoc");
  void hlaska.offsetWidth;
  hlaska.classList.add("naskoc");
});
</script>

</body>
</html>
